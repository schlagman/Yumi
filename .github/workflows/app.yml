# Builds Yumi.app (Release, unsigned) on GitHub's machines and keeps it as a downloadable
# artifact, for a Mac without Xcode. It is signed on the Mac that installs it.
name: App

on:
  push:
    branches: [pochette-paroles]
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$newest" ] && sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd Yumi && xcodegen

      - name: Build
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme Yumi \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Zip
        run: ditto -c -k --keepParent build/Build/Products/Release/Yumi.app Yumi.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Yumi
          path: Yumi.zip
          retention-days: 7
