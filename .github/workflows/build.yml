name: Build

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple silicon runners kept missing (capacity); the Release build is universal anyway
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$newest" ] && sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd Yumi && xcodegen

      - name: Build
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme Yumi \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme Yumi \
            -configuration Debug \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # The App Store target is not shipped yet, but it must keep compiling (see docs/journal.md).
      - name: Build App Store target
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme YumiAppStore \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # This fork installs Yumi from here: a Release build, unsigned (it is signed on the Mac
      # that installs it), kept as a downloadable artifact. Same job, so one runner is enough.
      - name: Build the app to install
        run: |
          xcodebuild \
            -project Yumi/Yumi.xcodeproj \
            -scheme Yumi \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          ditto -c -k --keepParent build/Build/Products/Release/Yumi.app Yumi.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Yumi
          path: Yumi.zip
          retention-days: 7
